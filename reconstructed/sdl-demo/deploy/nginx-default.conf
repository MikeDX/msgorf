# Served via docker-compose volume → /etc/nginx/conf.d/default.conf
# HTML must not be cached (it points at ?v=BUILD assets). Query-busted URLs can cache.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;

    # Always revalidate the shell so clients pick up new ?v= build ids.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.js / .data are cache-busted via ?v=BUILD_ID (script src + Module.locateFile).
    location ~* \.(js|data)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
