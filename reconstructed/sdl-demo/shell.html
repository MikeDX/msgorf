<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Ms. Gorf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0a0c10;
      --bg1: #12161e;
      --ink: #e8e2d4;
      --muted: #8a8490;
      --amber: #f0c820;
      --amber-dim: #9a7a18;
      --panel: rgba(18, 22, 30, 0.92);
      --line: rgba(240, 200, 32, 0.22);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, #1a2030 0%, transparent 55%),
        var(--bg0);
      color: var(--ink);
      font-family: "Silkscreen", monospace;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overflow: hidden;
      user-select: none;
    }
    #app {
      height: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto 1fr;
      padding: env(safe-area-inset-top) 0.75rem env(safe-area-inset-bottom);
      gap: 0.55rem;
    }
    #view-play {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 0;
      gap: 0.55rem;
    }
    #app.pads-hidden #pads {
      display: none;
    }
    #app:fullscreen,
    #app:-webkit-full-screen {
      max-width: none;
      width: 100%;
      height: 100%;
      padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
      background: var(--bg0);
    }
    #app:fullscreen.pads-hidden #stage,
    #app:-webkit-full-screen.pads-hidden #stage {
      border: none;
    }
    header {
      text-align: center;
      padding-top: 0.35rem;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.1rem, 4.5vw, 1.55rem);
      letter-spacing: 0.12em;
      color: var(--amber);
      text-shadow: 0 0 18px rgba(240, 200, 32, 0.35);
    }
    header p {
      margin: 0.25rem 0 0;
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    #stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      border: 1px solid var(--line);
      background: #000;
      border-radius: 2px;
      overflow: hidden;
    }
    canvas.emscripten {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      outline: none;
    }
    #hud-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.45rem 0.55rem;
      min-height: 2.4rem;
    }
    .hud-btn {
      appearance: none;
      border: 2px solid var(--line);
      background: linear-gradient(180deg, #1a1e28, #10141c);
      color: var(--muted);
      font: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.14em;
      padding: 0.45rem 0.7rem;
      cursor: pointer;
      border-radius: 2px;
      transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease, opacity 0.2s ease;
    }
    .hud-btn:active { transform: scale(0.97); }
    .hud-btn.on {
      border-color: var(--amber-dim);
      color: var(--amber);
    }
    #btn-start {
      appearance: none;
      border: 2px solid var(--amber);
      background: linear-gradient(180deg, #2a2410, #15120a);
      color: var(--amber);
      font: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      padding: 0.55rem 1.4rem;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 20px rgba(240, 200, 32, 0.15);
      transition: transform 0.08s ease, background 0.15s ease, opacity 0.2s ease;
    }
    #btn-start:active { transform: scale(0.97); background: #3a3018; }
    #btn-start.hidden { opacity: 0; pointer-events: none; }
    .hud-btn.hidden { display: none; }
    #btn-shield {
      appearance: none;
      border: 2px solid rgba(100, 180, 255, 0.45);
      background: linear-gradient(180deg, #142030, #0a121c);
      color: #8ec8ff;
      font: inherit;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      padding: 0.5rem 0.95rem;
      cursor: pointer;
      border-radius: 2px;
      touch-action: none;
      user-select: none;
      transition: transform 0.08s ease, background 0.1s ease, box-shadow 0.1s ease;
    }
    #btn-shield:active,
    #btn-shield.held {
      transform: scale(0.97);
      background: #1a3858;
      box-shadow: 0 0 16px rgba(100, 180, 255, 0.25);
    }
    #pads {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.5rem;
      padding: 0.15rem 0 0.5rem;
      align-items: end;
    }
    #pads .pad-col { min-width: 0; }
    #pads .shield-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 1.35rem;
    }
    .stick {
      position: relative;
      width: min(38vw, 150px);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 45%, #1c2230 0%, #0e1218 70%);
      border: 2px solid var(--line);
      box-shadow: inset 0 0 24px rgba(0,0,0,0.65);
      touch-action: none;
    }
    .stick[data-side="aim"] { border-color: rgba(220, 80, 60, 0.35); }
    .stick .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      margin: -21% 0 0 -21%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f4e08a, var(--amber-dim) 55%, #4a3a10);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 4px 10px rgba(0,0,0,0.45);
      pointer-events: none;
      will-change: transform;
    }
    .stick[data-side="aim"] .knob {
      background: radial-gradient(circle at 35% 30%, #f0a090, #a83828 55%, #401410);
    }
    .stick-label {
      text-align: center;
      font-size: 0.5rem;
      color: var(--muted);
      letter-spacing: 0.14em;
      margin-top: 0.35rem;
    }
    #status {
      text-align: center;
      font-size: 0.5rem;
      color: var(--muted);
      min-height: 1em;
    }
    #share-panel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      align-items: center;
      justify-content: center;
      background: rgba(6, 8, 12, 0.78);
      padding: 1rem;
      touch-action: auto;
      user-select: text;
      -webkit-user-select: text;
    }
    #share-panel.show { display: flex; }
    #stage.share-open canvas.emscripten {
      pointer-events: none;
    }
    #share-card {
      width: min(100%, 22rem);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 1rem 1.1rem 1.15rem;
      text-align: center;
    }
    #share-card h2 {
      margin: 0;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      color: var(--amber);
    }
    #share-card .score {
      margin: 0.55rem 0 0.85rem;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      color: var(--ink);
    }
    #share-card input {
      width: 100%;
      box-sizing: border-box;
      margin: 0 0 0.75rem;
      padding: 0.45rem 0.55rem;
      border: 1px solid var(--line);
      background: #0a0c10;
      color: var(--ink);
      font: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      border-radius: 2px;
      touch-action: manipulation;
      user-select: text;
      -webkit-user-select: text;
      pointer-events: auto;
    }
    #share-card .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
    }
    #share-card .row .hud-btn:disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    #share-card .hint {
      margin: 0.65rem 0 0;
      font-size: 0.45rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      min-height: 1.2em;
    }
    #nav {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
    }
    #nav .hud-btn.on {
      border-color: var(--amber);
      color: var(--amber);
    }
    #view-scores {
      display: none;
      flex-direction: column;
      min-height: 0;
      gap: 0.55rem;
    }
    #app.tab-scores {
      grid-template-rows: auto auto 1fr;
    }
    #app.tab-scores #view-play { display: none; }
    #app.tab-scores #view-scores { display: flex; }
    #app.tab-scores #nav { /* stay */ }
    .period-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    #scores-full {
      margin: 0;
      padding: 0 0.15rem;
      list-style: none;
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      overflow: auto;
      min-height: 0;
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.35);
      border-radius: 2px;
    }
    #scores-full li,
    #scores-teaser li {
      display: grid;
      grid-template-columns: 2rem 1fr auto;
      gap: 0.5rem;
      align-items: center;
      padding: 0.45rem 0.55rem;
      border-bottom: 1px solid rgba(240, 200, 32, 0.08);
      cursor: pointer;
    }
    #scores-full li:hover,
    #scores-teaser li:hover {
      background: rgba(240, 200, 32, 0.06);
      color: var(--ink);
    }
    #scores-full .sc,
    #scores-teaser .sc { color: var(--amber); }
    #scores-full .nm,
    #scores-teaser .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
    }
    #scores-teaser {
      margin: 0.35rem 0 0;
      padding: 0;
      list-style: none;
      font-size: 0.48rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      max-height: 4.8rem;
      overflow: auto;
    }
    #scores-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.5rem;
      padding: 1.5rem 0.5rem;
      letter-spacing: 0.08em;
    }
    #watch-panel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 6;
      align-items: center;
      justify-content: center;
      background: rgba(6, 8, 12, 0.82);
      padding: 1rem;
      touch-action: auto;
    }
    #watch-panel.show { display: flex; }
    #watch-card {
      width: min(100%, 22rem);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 1rem 1.1rem 1.15rem;
      text-align: center;
    }
    #watch-card h2 {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: var(--amber);
    }
    #watch-card .who {
      margin: 0.65rem 0 0.15rem;
      font-size: 0.85rem;
      color: var(--ink);
      letter-spacing: 0.08em;
    }
    #watch-card .score {
      margin: 0 0 0.9rem;
      font-size: 1.25rem;
      color: var(--amber);
      letter-spacing: 0.06em;
    }
    #watch-card .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
    }
    @media (min-width: 700px) {
      #app { max-width: 840px; }
      .stick { width: 160px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>MS. GORF</h1>
      <p>GUESS REMAKE · DISK PATTERNS · NOT XC.LOGIC</p>
    </header>

    <div id="nav">
      <button type="button" class="hud-btn on" id="tab-play" data-tab="play">PLAY</button>
      <button type="button" class="hud-btn" id="tab-scores" data-tab="scores">SCORES</button>
    </div>

    <div id="view-play">
      <div id="stage">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div id="share-panel" aria-hidden="true">
          <div id="share-card">
            <h2>GAME OVER</h2>
            <div class="score" id="share-score">$0</div>
            <input id="share-name" type="text" maxlength="24" placeholder="NAME (OPTIONAL)" autocomplete="nickname" enterkeyhint="done" inputmode="text" />
            <div class="row">
              <button type="button" class="hud-btn on" id="btn-submit">SUBMIT SCORE</button>
              <button type="button" class="hud-btn" id="btn-share" disabled>SHARE</button>
              <button type="button" class="hud-btn" id="btn-copy" disabled>COPY LINK</button>
              <button type="button" class="hud-btn" id="btn-share-close">CLOSE</button>
            </div>
            <p class="hint" id="share-hint"></p>
          </div>
        </div>
        <div id="watch-panel" aria-hidden="true">
          <div id="watch-card">
            <h2>REPLAY</h2>
            <div class="who" id="watch-who">ANON</div>
            <div class="score" id="watch-score">$0</div>
            <div class="row">
              <button type="button" class="hud-btn on" id="btn-watch-go">WATCH</button>
              <button type="button" class="hud-btn" id="btn-watch-cancel">CANCEL</button>
            </div>
          </div>
        </div>
      </div>

      <div id="controls">
        <div id="hud-bar">
          <button type="button" class="hud-btn" id="btn-fs" title="Fullscreen">FULL</button>
          <button type="button" class="hud-btn" id="btn-pads" title="Show or hide touch pads">PADS</button>
          <button type="button" class="hud-btn on hidden" id="btn-watch" title="Watch loaded replay">WATCH</button>
          <button type="button" class="hud-btn hidden" id="btn-stop" title="Stop replay and play yourself">EXIT REPLAY</button>
          <button type="button" id="btn-start">START</button>
        </div>
        <div id="pads">
          <div class="pad-col">
            <div class="stick" id="stick-move" data-side="move"><div class="knob"></div></div>
            <div class="stick-label">MOVE</div>
          </div>
          <div class="shield-col">
            <button type="button" id="btn-shield" title="Hold to drop shields (first 2s)">SHIELD</button>
            <div class="stick-label">HOLD · 2s</div>
          </div>
          <div class="pad-col">
            <div class="stick" id="stick-aim" data-side="aim"><div class="knob"></div></div>
            <div class="stick-label">AIM / FIRE</div>
          </div>
        </div>
        <ul id="scores-teaser"></ul>
        <div id="status">Loading…</div>
      </div>
    </div>

    <div id="view-scores">
      <div class="period-row">
        <button type="button" class="hud-btn" data-period="day">DAY</button>
        <button type="button" class="hud-btn" data-period="week">WEEK</button>
        <button type="button" class="hud-btn on" data-period="all">ALL TIME</button>
      </div>
      <ul id="scores-full"></ul>
      <div id="scores-empty" class="hidden">NO SCORES YET</div>
    </div>
  </div>

  <script>
    var lastShareMode = -1;
    var pendingReplayId = null;
    var pendingReplayBytes = null;
    var pendingReplayMeta = null; /* { score, name } */
    var lastUploadedId = null;
    var scoresPeriod = "all";
    var currentTab = "play";

    function b64urlEncode(bytes) {
      var bin = "";
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function b64urlDecode(s) {
      s = s.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      var bin = atob(s);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function getReplayBytes() {
      var len = Module._msgorf_replay_len();
      if (len <= 0) return null;
      var ptr = Module._malloc(len);
      var n = Module._msgorf_replay_copy(ptr, len);
      if (n < 0) {
        Module._free(ptr);
        return null;
      }
      var bytes = Module.HEAPU8.slice(ptr, ptr + n);
      Module._free(ptr);
      return bytes;
    }

    async function uploadRun(bytes, name) {
      var res = await fetch("/api/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          build_id: Module.MSGORF_BUILD || "dev",
          score: Module._msgorf_get_score(),
          name: name || "",
          replay_b64: b64urlEncode(bytes)
        })
      });
      var body = null;
      try { body = await res.json(); } catch (e) {}
      if (!res.ok) {
        var detail = (body && (body.detail || body.message)) || ("HTTP " + res.status);
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return body;
    }

    function replayUrl(id) {
      var u = new URL(window.location.href);
      u.search = "";
      u.hash = "";
      u.searchParams.set("r", id);
      return u.toString();
    }

    function setShareActionsEnabled(on) {
      document.getElementById("btn-share").disabled = !on;
      document.getElementById("btn-copy").disabled = !on;
    }

    function sharePanelOpen() {
      return document.getElementById("share-panel").classList.contains("show");
    }

    function watchPanelOpen() {
      return document.getElementById("watch-panel").classList.contains("show");
    }

    /*
     * SDL registers key handlers in capture phase and steals keys even when an
     * <input> is focused. We register on window first and, while the share
     * panel is open, stop SDL then apply keys to the name field ourselves.
     */
    function applyShareNameKey(e) {
      var input = document.getElementById("share-name");
      if (!input) return;
      if (document.activeElement !== input) input.focus();
      var start = input.selectionStart|0;
      var end = input.selectionEnd|0;
      var val = input.value;
      if (e.key === "Enter") {
        submitScore();
        return;
      }
      if (e.key === "Escape") {
        showSharePanel(false);
        return;
      }
      if (e.key === "Backspace") {
        if (start !== end) {
          input.value = val.slice(0, start) + val.slice(end);
          input.setSelectionRange(start, start);
        } else if (start > 0) {
          input.value = val.slice(0, start - 1) + val.slice(end);
          input.setSelectionRange(start - 1, start - 1);
        }
        return;
      }
      if (e.key === "Delete") {
        if (start !== end) {
          input.value = val.slice(0, start) + val.slice(end);
          input.setSelectionRange(start, start);
        } else if (start < val.length) {
          input.value = val.slice(0, start) + val.slice(end + 1);
          input.setSelectionRange(start, start);
        }
        return;
      }
      if (e.key === "ArrowLeft") {
        var p = Math.max(0, start - (start === end ? 1 : 0));
        if (start !== end) p = start;
        else p = Math.max(0, start - 1);
        input.setSelectionRange(p, p);
        return;
      }
      if (e.key === "ArrowRight") {
        var q = start !== end ? end : Math.min(val.length, start + 1);
        input.setSelectionRange(q, q);
        return;
      }
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        if (val.length >= 24 && start === end) return;
        var next = val.slice(0, start) + e.key + val.slice(end);
        if (next.length > 24) next = next.slice(0, 24);
        input.value = next;
        var caret = Math.min(24, start + e.key.length);
        input.setSelectionRange(caret, caret);
      }
    }

    function blockGameKeysWhileSharing(e) {
      if (!sharePanelOpen()) return;
      e.stopImmediatePropagation();
      if (e.type === "keydown") {
        e.preventDefault();
        applyShareNameKey(e);
      } else {
        e.preventDefault();
      }
    }
    window.addEventListener("keydown", blockGameKeysWhileSharing, true);
    window.addEventListener("keyup", blockGameKeysWhileSharing, true);
    window.addEventListener("keypress", blockGameKeysWhileSharing, true);

    async function submitScore() {
      var hint = document.getElementById("share-hint");
      var btn = document.getElementById("btn-submit");
      hint.textContent = "Checking replay…";
      btn.disabled = true;
      try {
        var bytes = getReplayBytes();
        if (!bytes) throw new Error("no recording");
        var name = document.getElementById("share-name").value.trim();
        var data = await uploadRun(bytes, name);
        lastUploadedId = data.id;
        setShareActionsEnabled(true);
        if (data.duplicate) {
          hint.textContent = "Already on the board · $" + data.score;
        } else {
          hint.textContent = "Submitted · $" + data.score + " (verified)";
        }
        refreshScores();
      } catch (e) {
        hint.textContent = "Submit failed — " + (e.message || e);
        btn.disabled = false;
      }
    }

    async function shareReplay() {
      var hint = document.getElementById("share-hint");
      if (!lastUploadedId) {
        hint.textContent = "Submit your score first";
        return;
      }
      var url = replayUrl(lastUploadedId);
      hint.textContent = url;
      if (navigator.share) {
        try {
          await navigator.share({
            title: "Ms. Gorf",
            text: "I scored $" + Module._msgorf_get_score() + " in Ms. Gorf",
            url: url
          });
        } catch (e) {}
      } else {
        try {
          await navigator.clipboard.writeText(url);
          hint.textContent = "Copied: " + url;
        } catch (e) {
          hint.textContent = url;
        }
      }
    }

    async function copyReplayLink() {
      var hint = document.getElementById("share-hint");
      if (!lastUploadedId) {
        hint.textContent = "Submit your score first";
        return;
      }
      try {
        var url = replayUrl(lastUploadedId);
        await navigator.clipboard.writeText(url);
        hint.textContent = "Copied: " + url;
      } catch (e) {
        hint.textContent = "Copy failed — " + (e.message || e);
      }
    }

    function showSharePanel(show) {
      var panel = document.getElementById("share-panel");
      var stage = document.getElementById("stage");
      panel.classList.toggle("show", !!show);
      panel.setAttribute("aria-hidden", show ? "false" : "true");
      stage.classList.toggle("share-open", !!show);
      if (show) {
        showWatchPanel(false);
        document.getElementById("share-score").textContent =
          "$" + Module._msgorf_get_score();
        document.getElementById("share-hint").textContent =
          "Enter a name, then SUBMIT SCORE";
        lastUploadedId = null;
        setShareActionsEnabled(false);
        document.getElementById("btn-submit").disabled = false;
        var canvas = document.getElementById("canvas");
        if (canvas) canvas.blur();
        var name = document.getElementById("share-name");
        name.value = name.value || "";
        setTimeout(function () { name.focus(); name.select(); }, 30);
      }
    }

    function showWatchPanel(show) {
      var panel = document.getElementById("watch-panel");
      panel.classList.toggle("show", !!show);
      panel.setAttribute("aria-hidden", show ? "false" : "true");
      if (show && pendingReplayMeta) {
        showSharePanel(false);
        setTab("play");
        document.getElementById("watch-who").textContent =
          pendingReplayMeta.name || "ANON";
        document.getElementById("watch-score").textContent =
          "$" + (pendingReplayMeta.score != null ? pendingReplayMeta.score : 0);
        var canvas = document.getElementById("canvas");
        if (canvas) canvas.blur();
      }
    }

    function setTab(tab) {
      currentTab = tab === "scores" ? "scores" : "play";
      var app = document.getElementById("app");
      app.classList.toggle("tab-scores", currentTab === "scores");
      document.getElementById("tab-play").classList.toggle("on", currentTab === "play");
      document.getElementById("tab-scores").classList.toggle("on", currentTab === "scores");
      if (currentTab === "scores") refreshScores();
    }

    function setScoresPeriod(period) {
      scoresPeriod = period || "all";
      document.querySelectorAll("[data-period]").forEach(function (btn) {
        btn.classList.toggle("on", btn.getAttribute("data-period") === scoresPeriod);
      });
      refreshScores();
    }

    function fillScoreList(ul, rows, emptyEl) {
      ul.innerHTML = "";
      if (!rows.length) {
        if (emptyEl) emptyEl.classList.remove("hidden");
        return;
      }
      if (emptyEl) emptyEl.classList.add("hidden");
      rows.forEach(function (r, i) {
        var li = document.createElement("li");
        var rank = document.createElement("span");
        rank.textContent = String(i + 1) + ".";
        var nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = r.name || "ANON";
        var sc = document.createElement("span");
        sc.className = "sc";
        sc.textContent = "$" + r.score;
        li.appendChild(rank);
        li.appendChild(nm);
        li.appendChild(sc);
        li.title = "Watch " + (r.name || "ANON") + " · $" + r.score;
        li.addEventListener("click", function () {
          var u = new URL(window.location.href);
          u.searchParams.set("r", r.id);
          history.replaceState(null, "", u.pathname + u.search + u.hash);
          setTab("play");
          loadReplayById(r.id, false);
        });
        ul.appendChild(li);
      });
    }

    async function refreshScores() {
      var teaser = document.getElementById("scores-teaser");
      var full = document.getElementById("scores-full");
      var empty = document.getElementById("scores-empty");
      try {
        var q = "/api/scores?limit=" + (currentTab === "scores" ? "50" : "5") +
          "&period=" + encodeURIComponent(scoresPeriod);
        var res = await fetch(q);
        if (!res.ok) throw new Error("scores");
        var rows = await res.json();
        if (currentTab === "scores") {
          fillScoreList(full, rows, empty);
        } else {
          /* Play tab teaser always shows all-time top 5 */
          var tres = await fetch("/api/scores?limit=5&period=all");
          var trows = tres.ok ? await tres.json() : rows.slice(0, 5);
          fillScoreList(teaser, trows, null);
        }
      } catch (e) {
        if (teaser) teaser.innerHTML = "";
        if (full) full.innerHTML = "";
        if (empty) empty.classList.remove("hidden");
      }
    }

    function clearReplayQuery() {
      try {
        var u = new URL(window.location.href);
        if (!u.searchParams.has("r")) return;
        u.searchParams.delete("r");
        history.replaceState(null, "", u.pathname + u.search + u.hash);
      } catch (e) {}
    }

    function startPendingReplay() {
      if (!ready() || !pendingReplayBytes) return;
      showSharePanel(false);
      showWatchPanel(false);
      setTab("play");
      var bytes = pendingReplayBytes;
      var ptr = Module._malloc(bytes.length);
      Module.HEAPU8.set(bytes, ptr);
      var ok = Module._msgorf_replay_play(ptr, bytes.length);
      Module._free(ptr);
      if (!ok) {
        document.getElementById("status").textContent = "Replay start failed";
        return;
      }
      var who = (pendingReplayMeta && pendingReplayMeta.name) || "ANON";
      var sc = pendingReplayMeta && pendingReplayMeta.score != null
        ? pendingReplayMeta.score : "?";
      document.getElementById("status").textContent =
        "REPLAY · " + who + " · $" + sc + " · EXIT REPLAY to play yourself";
    }

    function stopReplayToPlay() {
      if (!ready()) return;
      showSharePanel(false);
      showWatchPanel(false);
      Module._msgorf_replay_stop();
      clearReplayQuery();
      if (pendingReplayBytes) {
        var who = (pendingReplayMeta && pendingReplayMeta.name) || "ANON";
        var sc = pendingReplayMeta && pendingReplayMeta.score != null
          ? pendingReplayMeta.score : "?";
        document.getElementById("status").textContent =
          "Replay ready · " + who + " · $" + sc;
        showWatchPanel(true);
      } else {
        document.getElementById("status").textContent =
          "Move · Aim/fire · SHIELD hold (first 2s) · triggers on pad · A/Start";
      }
      syncStartButton();
    }

    async function loadReplayById(id, autoplay) {
      pendingReplayId = id;
      document.getElementById("status").textContent = "Loading replay…";
      try {
        var res = await fetch("/api/runs/" + encodeURIComponent(id));
        if (!res.ok) throw new Error("run " + res.status);
        var data = await res.json();
        pendingReplayBytes = b64urlDecode(data.replay_b64);
        pendingReplayMeta = { score: data.score || 0, name: data.name || "" };
        document.getElementById("status").textContent =
          "Replay ready · " + (pendingReplayMeta.name || "ANON") +
          " · $" + pendingReplayMeta.score;
        showSharePanel(false);
        syncStartButton();
        if (autoplay) startPendingReplay();
        else showWatchPanel(true);
      } catch (e) {
        pendingReplayBytes = null;
        pendingReplayMeta = null;
        showWatchPanel(false);
        document.getElementById("status").textContent =
          "Replay load failed: " + (e.message || e);
        syncStartButton();
      }
    }

    async function tryLoadReplayFromUrl() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("r");
      if (!id) return;
      await loadReplayById(id, false);
    }

    var Module = {
      canvas: document.getElementById("canvas"),
      onRuntimeInitialized: function () {
        if (Module.MSGORF_BUILD) {
          Module.ccall("msgorf_set_build_id", null, ["string"], [Module.MSGORF_BUILD]);
        }
        document.getElementById("status").textContent =
          "Move · Aim/fire · SHIELD hold (first 2s) · triggers on pad · A/Start";
        bindUi();
        setInterval(syncStartButton, 250);
        refreshScores();
        tryLoadReplayFromUrl();
      }
    };

    var touchShieldDown = false;

    function ready() {
      return typeof Module._msgorf_pad_move === "function";
    }

    function setShield(down) {
      touchShieldDown = !!down;
      var btn = document.getElementById("btn-shield");
      if (btn) btn.classList.toggle("held", touchShieldDown);
      if (ready()) Module._msgorf_pad_shield(touchShieldDown ? 1 : 0);
    }

    function syncStartButton() {
      if (!ready()) return;
      var mode = Module._msgorf_get_mode();
      var watching = Module._msgorf_replay_mode() === 3; /* PLAYING */
      var btn = document.getElementById("btn-start");
      var btnWatch = document.getElementById("btn-watch");
      var btnStop = document.getElementById("btn-stop");

      btnWatch.classList.toggle("hidden", watching || !pendingReplayBytes);
      btnStop.classList.toggle("hidden", !watching);

      if (watching) {
        btn.classList.add("hidden");
        showSharePanel(false);
        if (mode === 3 && lastShareMode !== 3) {
          document.getElementById("status").textContent =
            "Replay finished · EXIT REPLAY or WATCH again";
        }
      } else if (mode === 0) { /* SELECT */
        btn.textContent = "START";
        btn.classList.remove("hidden");
        showSharePanel(false);
      } else if (mode === 3) { /* DEAD — own run */
        btn.textContent = "AGAIN";
        btn.classList.remove("hidden");
        if (Module._msgorf_replay_ready() && lastShareMode !== 3) {
          showSharePanel(true);
        }
      } else {
        btn.classList.add("hidden");
        showSharePanel(false);
      }
      lastShareMode = mode;
    }

    function fsElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function syncFsButton() {
      var btn = document.getElementById("btn-fs");
      var on = !!fsElement();
      btn.textContent = on ? "EXIT" : "FULL";
      btn.classList.toggle("on", on);
    }

    function toggleFullscreen() {
      var app = document.getElementById("app");
      if (fsElement()) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
      } else {
        var req = app.requestFullscreen || app.webkitRequestFullscreen;
        if (req) req.call(app);
      }
    }

    function setPadsVisible(show) {
      var app = document.getElementById("app");
      var btn = document.getElementById("btn-pads");
      app.classList.toggle("pads-hidden", !show);
      btn.textContent = show ? "PADS" : "PADS+";
      btn.classList.toggle("on", show);
      try { localStorage.setItem("msgorf_pads", show ? "1" : "0"); } catch (e) {}
      if (!show) setShield(false);
    }

    function bindStick(el, onMove, onEnd) {
      var knob = el.querySelector(".knob");
      var pid = null;

      function setKnob(nx, ny) {
        var max = el.clientWidth * 0.28;
        knob.style.transform = "translate(" + (nx * max) + "px," + (ny * max) + "px)";
      }

      function normFromEvent(ev) {
        var r = el.getBoundingClientRect();
        var cx = r.left + r.width / 2;
        var cy = r.top + r.height / 2;
        var dx = (ev.clientX - cx) / (r.width * 0.5);
        var dy = (ev.clientY - cy) / (r.height * 0.5);
        var m = Math.hypot(dx, dy);
        if (m > 1) { dx /= m; dy /= m; m = 1; }
        return { x: dx, y: dy, m: m };
      }

      function down(ev) {
        if (pid !== null) return;
        pid = ev.pointerId;
        el.setPointerCapture(pid);
        var n = normFromEvent(ev);
        setKnob(n.x, n.y);
        onMove(n.x, n.y, n.m);
        ev.preventDefault();
      }
      function move(ev) {
        if (ev.pointerId !== pid) return;
        var n = normFromEvent(ev);
        setKnob(n.x, n.y);
        onMove(n.x, n.y, n.m);
        ev.preventDefault();
      }
      function up(ev) {
        if (ev.pointerId !== pid) return;
        pid = null;
        setKnob(0, 0);
        onEnd();
        ev.preventDefault();
      }

      el.addEventListener("pointerdown", down);
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", up);
    }

    function bindHoldButton(el, onDown, onUp) {
      var pid = null;
      function down(ev) {
        if (pid !== null) return;
        pid = ev.pointerId;
        el.setPointerCapture(pid);
        onDown();
        ev.preventDefault();
      }
      function up(ev) {
        if (ev.pointerId !== pid) return;
        pid = null;
        onUp();
        ev.preventDefault();
      }
      el.addEventListener("pointerdown", down);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", up);
      el.addEventListener("lostpointercapture", function () {
        if (pid === null) return;
        pid = null;
        onUp();
      });
    }

    function bindUi() {
      document.getElementById("btn-start").addEventListener("click", function () {
        if (!ready()) return;
        showSharePanel(false);
        if (Module._msgorf_replay_mode() === 3) {
          stopReplayToPlay();
          return;
        }
        Module._msgorf_pad_start(1);
        syncStartButton();
      });

      document.getElementById("btn-watch").addEventListener("click", function () {
        if (pendingReplayBytes) showWatchPanel(true);
      });
      document.getElementById("btn-stop").addEventListener("click", function () {
        stopReplayToPlay();
      });
      document.getElementById("btn-watch-go").addEventListener("click", function () {
        startPendingReplay();
        syncStartButton();
      });
      document.getElementById("btn-watch-cancel").addEventListener("click", function () {
        showWatchPanel(false);
        clearReplayQuery();
        document.getElementById("status").textContent =
          pendingReplayBytes
            ? ("Replay ready · " + ((pendingReplayMeta && pendingReplayMeta.name) || "ANON") +
               " · $" + ((pendingReplayMeta && pendingReplayMeta.score) || 0))
            : "Move · Aim/fire · SHIELD hold (first 2s) · triggers on pad · A/Start";
      });

      document.getElementById("tab-play").addEventListener("click", function () {
        setTab("play");
      });
      document.getElementById("tab-scores").addEventListener("click", function () {
        setTab("scores");
      });
      document.querySelectorAll("[data-period]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setScoresPeriod(btn.getAttribute("data-period"));
        });
      });

      document.getElementById("btn-submit").addEventListener("click", submitScore);
      document.getElementById("btn-share").addEventListener("click", shareReplay);
      document.getElementById("btn-copy").addEventListener("click", copyReplayLink);
      document.getElementById("btn-share-close").addEventListener("click", function () {
        showSharePanel(false);
      });

      document.getElementById("btn-fs").addEventListener("click", toggleFullscreen);
      document.addEventListener("fullscreenchange", syncFsButton);
      document.addEventListener("webkitfullscreenchange", syncFsButton);
      syncFsButton();

      var padsPref = "1";
      try { padsPref = localStorage.getItem("msgorf_pads") || "1"; } catch (e) {}
      setPadsVisible(padsPref !== "0");
      document.getElementById("btn-pads").addEventListener("click", function () {
        setPadsVisible(document.getElementById("app").classList.contains("pads-hidden"));
      });

      bindHoldButton(document.getElementById("btn-shield"), function () {
        setShield(true);
      }, function () {
        setShield(false);
      });

      bindStick(document.getElementById("stick-move"), function (x, y) {
        if (ready()) Module._msgorf_pad_move(x, y);
      }, function () {
        if (ready()) Module._msgorf_pad_move(0, 0);
      });

      bindStick(document.getElementById("stick-aim"), function (x, y) {
        if (!ready()) return;
        Module._msgorf_pad_aim(x, y);
      }, function () {
        if (!ready()) return;
        Module._msgorf_pad_aim(0, 0);
      });
    }

    /* Physical gamepad on web: right stick aim/fire; L/R triggers = shields. */
    function pollWebGamepad() {
      if (!ready() || !navigator.getGamepads || sharePanelOpen() || watchPanelOpen()) return;
      var pads = navigator.getGamepads();
      var gp = null;
      for (var i = 0; i < pads.length; i++) {
        if (pads[i]) {
          gp = pads[i];
          break;
        }
      }
      if (!gp) return;
      var lx = gp.axes[0] || 0,
        ly = gp.axes[1] || 0;
      var rx = gp.axes[2] || 0,
        ry = gp.axes[3] || 0;
      if (Math.hypot(lx, ly) < 0.18) {
        lx = 0;
        ly = 0;
      }
      if (Math.hypot(rx, ry) < 0.18) {
        rx = 0;
        ry = 0;
      }
      Module._msgorf_pad_move(lx, ly);
      Module._msgorf_pad_aim(rx, ry);
      var lt = gp.buttons[6] ? gp.buttons[6].value : 0;
      var rt = gp.buttons[7] ? gp.buttons[7].value : 0;
      var triggerShield = lt > 0.25 || rt > 0.25;
      Module._msgorf_pad_shield(touchShieldDown || triggerShield ? 1 : 0);
      if (gp.buttons[9] && gp.buttons[9].pressed) Module._msgorf_pad_start(1);
      if (gp.buttons[0] && gp.buttons[0].pressed) Module._msgorf_pad_start(1);
    }
    setInterval(pollWebGamepad, 16);
  </script>

    Module["locateFile"] = function (path, prefix) {
      return (prefix || "") + path + "?v=" + Module["MSGORF_BUILD"];
    };
